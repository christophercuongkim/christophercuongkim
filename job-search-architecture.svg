<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" role="img" aria-labelledby="t d">
  <title id="t">job-search request path</title>
  <desc id="d">A browser calls a Next.js BFF that owns no database. The BFF signs a short-lived HS256 service token and calls an internal Go API, which owns the entire schema and talks to Neon Postgres through pgx with SQL generated by sqlc. A FastAPI sidecar beside the Go API serves embeddings.</desc>

  <style>
    .bx   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.25; }
    .ttl  { fill: #1f2328; font-weight: 600; font-size: 14px; }
    .sub  { fill: #656d76; font-size: 11.5px; }
    .lbl  { fill: #656d76; font-size: 11.5px; }
    .acc  { fill: #0969da; font-size: 11.5px; }
    .ln   { stroke: #656d76; stroke-width: 1.25; fill: none; }
    .head { fill: #656d76; }
    text  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bx   { fill: #161b22; stroke: #30363d; }
      .ttl  { fill: #e6edf3; }
      .sub  { fill: #8b949e; }
      .lbl  { fill: #8b949e; }
      .acc  { fill: #4493f8; }
      .ln   { stroke: #8b949e; }
      .head { fill: #8b949e; }
    }
  </style>

  <!-- browser -->
  <rect class="bx" x="40" y="20" width="200" height="62" rx="7"/>
  <text class="ttl" x="140" y="57" text-anchor="middle">Browser</text>

  <path class="ln" d="M140 82 L140 122"/>
  <path class="head" d="M140 130 l-4.5 -9 h9 Z"/>
  <text class="lbl" x="152" y="107">HTTPS</text>

  <!-- BFF -->
  <rect class="bx" x="40" y="130" width="200" height="72" rx="7"/>
  <text class="ttl" x="140" y="161" text-anchor="middle">Next.js BFF</text>
  <text class="sub" x="140" y="180" text-anchor="middle">owns no database</text>

  <path class="ln" d="M140 202 L140 242"/>
  <path class="head" d="M140 250 l-4.5 -9 h9 Z"/>
  <text class="acc" x="152" y="220">short-lived HS256</text>
  <text class="acc" x="152" y="235">service token</text>

  <!-- Go API -->
  <rect class="bx" x="40" y="250" width="200" height="72" rx="7"/>
  <text class="ttl" x="140" y="281" text-anchor="middle">Go API</text>
  <text class="sub" x="140" y="300" text-anchor="middle">owns the entire schema</text>

  <!-- sidecar -->
  <path class="ln" d="M240 286 L292 286"/>
  <path class="head" d="M300 286 l-9 -4.5 v9 Z"/>
  <rect class="bx" x="300" y="250" width="180" height="72" rx="7"/>
  <text class="ttl" x="390" y="281" text-anchor="middle">FastAPI</text>
  <text class="sub" x="390" y="300" text-anchor="middle">embeddings</text>

  <path class="ln" d="M140 322 L140 362"/>
  <path class="head" d="M140 370 l-4.5 -9 h9 Z"/>
  <text class="lbl" x="152" y="340">pgx, SQL generated</text>
  <text class="lbl" x="152" y="355">by sqlc</text>

  <!-- database -->
  <rect class="bx" x="40" y="370" width="200" height="62" rx="7"/>
  <text class="ttl" x="140" y="396" text-anchor="middle">Neon Postgres</text>
  <text class="sub" x="140" y="415" text-anchor="middle">69 migrations</text>
</svg>
